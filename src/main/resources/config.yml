# ============================================================================
# TH Tech（Touhou 附属）配置
#   这个文件会被 saveDefaultConfig() 释放到 plugins/Touhou/config.yml
# ============================================================================

# ---------------------------------------------------------------------------
# 控制台日志总开关
#   false（默认）—— info 全部静默，控制台只留 warning 与 error。
#   true         —— 额外输出 info：注册结果 / 结构载入 / 机器启停 这类叙述。
#
#   ★ 只关「叙述」，不关「线索」：
#     · warning —— 配置数值越界被钳制、可选依赖缺失等，【永远输出】；
#     · error   —— 代码层面的异常（带堆栈），【永远输出】。
#     所以关掉它不会让你在出问题时失去排查依据，只是把正常运转的流水账关掉。
#
#   ★ 所有 info 都经 com.example.touhou.core.Log 收口，新代码请用 Log.info(...)
#     而不是直接 getLogger().info(...)，否则这个开关管不到它。
# ---------------------------------------------------------------------------
logging:
  console-info: false

# ============================================================================
# 粘液书（Slimefun 指南）里的自定义配方页 + 核心物品描述
#   ★ 两个多方块核心（反应堆 / 赛钱箱）都实现了 RecipeDisplayItem：
#     指南打开它们的页面时，底部网格显示的不是原版合成表，而是
#     带自定义 lore 的图标（材料 N / 输入数量: X / 产物 N / 进程耗时）。
#   ★ 那些内容全部【现场从注册表/配置生成】：
#       祭坛 —— 遍历 SaizenbakoRecipes 里已注册的每一条祈愿配方；
#       反应堆 —— 遍历 AGenerator 已注册的 MachineFuel + 下面 reactor 段的数值。
#     所以往配方注册表里加一条，书里就会自动多一条，不必改任何展示代码。
#   ★ 核心物品描述里的「建造所需材料」清单同理，从下面 reactor.structure /
#     saizenbako.structure 的【层图】现算（不依赖结构实例 —— 构造 lore 时结构还没创建）。
# ============================================================================
guide:
  # 是否往核心物品描述里追加「建造所需材料（共 X 个构件 / Y 种）」清单。
  material-lore: true
  # 那份清单最多列【几种】材料（<= 0 = 不限制）。
  #   ★ 合并计数后两种内置结构都只有 4 种（反应堆 44 框架 + 36 保护罩 + 9 基座
  #     + 9 稳定器 = 98 个构件），正常配置下列得完。
  #   ★ 但 legend 是玩家可改的：塞进几十种方块时物品提示框会被撑爆。
  #     超出上限的部分只统计不列出 —— 标题行的"共 X 个构件 / Y 种"永远是完整的。
  material-kinds: 6

# ============================================================================
# 多方块投影（照搬 LogiTech 的全息机制）
#   ★ 它不是粒子、也不是假方块，而是【原版实体】：
#       核心位置 +(0.5,0.5,0.5) 生成一个 Interaction 父实体（碰撞箱 0.1），
#       结构 schema 的每一格再生成一个 ItemDisplay 子实体（缩放 0.5），
#       显示"这里该放什么"（物品取自 partId → ItemStack 映射）。
#   ★ 开关入口在两种核心各自的 GUI 里；开关状态持久化在方块数据
#       touhou:mb-hologram（参照 LogiTech 的 "holo" 键）。
#   ★ 清理时机：核心被拆 / 结构失效停机 / 关服全清 /
#       /touhou proj clean 扫孤儿。
# ============================================================================
projection:
  # 总开关。false = GUI 里点投影按钮只会提示"已被配置关闭"，不生成任何实体。
  enabled: true
  # 单次投影的【构件】上限（格）。
  #   ★ 投影是"每格一个实体"，所以必须有闸：LogiTech 的机制本身没有上限，
  #     结构多大就画多大（它的超新星模拟器一开就是 187 个实体）。
  #   ★ 超过上限是【整组拒绝】（不是画一半），原因会回显给玩家。
  #   两种内置结构都远在闸内：反应堆 98 格、赛钱箱 48 格。
  max-parts: 256
  # /touhou proj clean 的默认扫描半径（格）。
  #   ★ 只删"带 display-source 标记、又不在本插件当前持有的实体表里"的
  #     Display / Interaction —— 正在用的投影不会被误删。
  clean-radius: 32

# 旧地狱-灵乌路空反应堆（TOUHOU_COMPLEX_MACHINE_UTSUHO_REACTOR_CORE）
reactor:
  # 电量存储上限（J）。Slimefun 本体的电容是 int，所以上限天然是 2^31-1=2147483647
  energy-capacity: 2147483647
  # 发电功率（J / 一个 Slimefun tick）
  energy-production: 240000000
  # 一个原油桶的进程时长（Slimefun tick）。20 tick = 1 秒，所以 600 = 30 秒
  process-ticks: 600
  # ★ 产物模式：用"发电量"换"工作效率"
  #   product-mode-speed-multiplier = 工作效率倍率（相对发电模式），5.0 = 500%
  #   product-mode-energy-rate      = 发电倍率（相对发电模式），0.1 = 只发原本的 10%
  #   实现方式是"每 tick 多推进几 tick 进度"，所以中途切模式会立刻生效。
  product-mode-speed-multiplier: 5.0
  product-mode-energy-rate: 0.1
  # 发电模式的暂停阈值（J）：储电 >= 该值时暂停进程（保留进度）。
  # ★ 必须 < energy-capacity，否则发电模式永远触发不了（启动时会告警并自动钳制到上限的 90%）。
  #   默认 2e8 略小于一个 tick 的发电量 2.4e8，方便观测"发电/产物"两种模式的差别。
  mode-threshold: 200000000
  # 结构不完整时是否中断正在进行的燃料进程（中断 = 已消耗的燃料不归还，代价真实）
  abort-process-on-broken: true
  # --------------------------------------------------------------------------
  # 多方块结构【检测节流】（tick）—— 不是每 tick 全量扫结构。
  #   实现是一个【有符号计数器】：未激活时正数向上累计、已激活时负数向下累计，
  #   到对应阈值才做一次结构检测（5×5×5 容器 = 124 格查询，每 tick 扫没必要）。
  #   单位是 Slimefun tick（默认 10 tick = 1 秒）。
  #
  #   ★ auto-build-ticks 同时是【自动构建】的尝试时机：构建模式为「自动」时，
  #     结构一旦被检测为完整就自动激活（不用点信息格）。
  #     调小 = 搭好后反应更快；调大 = 更省扫描。
  #   ★ 不受这里影响的两条硬保证：
  #     · 开进程前的把关（startGate）永远是现场检测 —— 结构不完整绝不会开新进程；
  #     · 点信息格激活 / /touhou structure 也是现场检测。
  #   runtime-ticks 决定"拆掉结构后最多多久被发现并中断进程"。
  # --------------------------------------------------------------------------
  check-interval:
    auto-build-ticks: 5
    runtime-ticks: 10
    # 在结构构件周围找核心的扫描半径（格）。
    #   5×5×5 结构里构件到核心最多差 2 格，默认 2 足够；
    #   结构变大时要同步调大，否则右键构件会找不到核心。
    core-search-radius: 2
    # 「右键构件触发检测」的最小间隔（毫秒）。
    #   ★ 自动构建模式下，玩家右键结构里的任意构件（除核心外）都会触发一次
    #     【现场】结构检测（124 格方块查询），所以必须有冷却 ——
    #     否则连点会变成对服务器的拒绝服务。250ms ≈ 每秒最多 4 次，正常搭建感觉不到。
    #   设 0 = 不冷却（不建议）。
    click-cooldown-ms: 250
  # --------------------------------------------------------------------------
  # 物流接口（两个物品，各自负责一个方向）
  #   TOUHOU_COMPLEX_MACHINE_REACTOR_INPUT_PORT   红色染色玻璃：本接口输入槽 → 核心输入槽
  #   TOUHOU_COMPLEX_MACHINE_REACTOR_OUTPUT_PORT  蓝色染色玻璃：核心输出槽 → 本接口输出槽
  #   两者都能替代保护罩，且可以【同时】出现在一座反应堆里（一个管进、一个管出）。
  #   interval-seconds：搬运间隔（真实秒）—— spec 要求"每 5s 一次"。
  #   ★ 单位是【真实秒】而不是 tick：搬运跑在 Slimefun tick 上，其长度由 Slimefun 的
  #     tickRate 决定（默认 10/秒 = 原版的一半），写死 tick 会让 5 秒变成 50 秒。
  #   ★ 只在代理的核心【已激活】时才搬运；未激活时接口只更新显示、不动物品。
  #   ★ 它们读写的是【接口自己的】容器，与核心容器相互独立，不是共用一份库存。
  #   core-scan-retry-ms：接口"没找到核心"时的重扫间隔（毫秒）。
  #     ★ 接口每 tick 都要问一次"我的核心在哪"。命中缓存只花一次 checkID，但没找到核心时
  #       缓存是空的 —— 于是会【每 tick 重扫 5×5×5 = 125 格】。而"先放接口、再搭核心"
  #       是极常见的建造顺序（实测：一次联机测试里 8 个孤立接口刷了 36 条警告）。
  #       现在负结果也记 1 秒：这段时间直接返回"没有核心"。
  #     ★ 点 GUI（信息格/模式/激活）会【强制重扫】，不受这一秒影响 ——
  #       所以搭好核心后点一下就能立刻认出来，不会"点不动"。
  #     ★ 设成 0 = 每次都重扫（回到旧行为，只适合排查问题）。
  # --------------------------------------------------------------------------
  io:
    interval-seconds: 5
    core-scan-retry-ms: 1000
  # 是否禁止货运网络（物品运输）访问反应堆的输入输出槽
  disable-item-transport: true
  # 聊天提示前缀
  message-prefix: "&8[&6灵乌路空反应堆&8] &r"

  # --------------------------------------------------------------------------
  # 游戏内【消息栏】的详细程度 —— 决定玩家聊天栏里能看到多少推送。
  #   ★ 默认 important：只报"重要事件"和 warning/error，其余一律不推送。
  #     在本机实测里，旧的实现会让玩家每点一下 GUI 就多一行消息（切换模式、
  #     开关粒子、中止进程…），消息栏很快就被自己的操作回显刷满。
  #
  #   off        只报 warning/error（连"结构构建成功"都不报）
  #   important  warning/error + 重要事件（多方块结构构建成功 / 反应堆已激活）← 默认
  #   normal     再加常规操作反馈（切换发电模式、开关粒子特效…）
  #   all        再加诊断细节（结构归属 uid、绑定了哪个核心…）
  #
  #   ⚠ warning/error 不受这一项影响，永远输出（例如"结构不完整，无法激活"、
  #     "找不到反应堆核心"、"你没有权限使用该道具"）。
  #   ⚠ 命令回显（/touhou ...）也不算推送，不受这一项影响 —— 那是玩家主动敲的。
  # --------------------------------------------------------------------------
  messages:
    level: important

  # --------------------------------------------------------------------------
  # 多方块结构
  #   mode: LAYERED = 用下面的层图检测；DISABLED = 不做结构检测（调试用，永远视为完整）
  #
  #   层图写法：每层是若干个等长字符串。
  #     · 一个字符串 = 世界里沿 z 轴的一"行"（行号越大 z 越大）
  #     · 行内每个字符 = 沿 x 轴的一格（列号越大 x 越大）
  #     · 每层行数必须一致、每行长度必须一致
  #     · 层与层之间沿 y 轴从下往上
  #   字符含义见 legend；'C' 是保留字符，代表【多方块核心自己那一格】，
  #   必须恰好一个，且必须落在层图的正中（左右居中 + 前后居中）。
  #
  #   ★★ 层号语义（写错会让整个结构整体错一层，真实踩过）：
  #     · 层号 0 = 最下面那一层，层号越大越高；
  #     · 含 'C' 的那一层就是"核心所在层"，被记作相对 y = 0：
  #         把 C 放在 index=1（第 2 层）→ 结构相对核心是 y = -1 / 0 / +1 ✔
  #         把 C 放在 index=0（第 1 层）→ 结构相对核心变成 y =  0 / +1 / +2 ✘
  #            （核心成了整个结构的"底面"，检测点会整体上移一层）
  #
  #   ★ 层图必须用【嵌套列表】写（每层一个 "- -" 开头）：
  #     YAML 序列里表达不出"层分隔符"，写成扁平的 9 行会被误解析成"1 层 9 行"。
  #
  #   ★ 关于供电：能源调节器可以【远程连接，半径 7 格】，所以结构不必为它留洞。
  #     只要在核心 7 格内放一个能源调节器（或电容）即可；
  #     否则本体电力网络不会 tick 这台发电机，表现为"燃料在烧却什么都不发"。
  # --------------------------------------------------------------------------
  structure:
    mode: LAYERED
    # 结构是否【绕纵轴四向旋转不变】。参照 LogiTech 的 isSymmetric：
    #   true  = 只探测 NORTH 一个方向（省 3/4 次方块查询）
    #   false = NORTH/EAST/SOUTH/WEST 四个方向依次探测，任一匹配即通过
    # ★ 一般【不要填】—— 留注释掉或不写时由程序自动判定（把每层旋转 90° 与原图逐格比对），
    #   5×5×5 反应堆每层都是中心对称的，会自动算出 true。
    # ★ 若手工填 true 而结构其实不对称，结构会在其它朝向下永远校验失败，
    #   而报错只说"某格应为 X 实际 Y"，极难定位。只有确信自动判定算错时才覆盖。
    #symmetric: true
    layers:
      # 5×5×5 反应堆容器（按用户实建结构扫描还原，2026-09-16）
      #   C = 核心自己那一格，落在正中（左右/前后居中，第 3 层 = 相对核心 y=0）
      # 第 1 层（相对核心 y=-2）：外圈框架 + 内 3×3 基座
      - - "FFFFF"
        - "FBBBF"
        - "FBBBF"
        - "FBBBF"
        - "FFFFF"
      # 第 2 层（y=-1）：四角框架 + 四周保护罩，内部空心
      - - "FSSSF"
        - "S___S"
        - "S___S"
        - "S___S"
        - "FSSSF"
      # 第 3 层（y=0）：核心在这一层
      - - "FSSSF"
        - "S___S"
        - "S_C_S"
        - "S___S"
        - "FSSSF"
      # 第 4 层（y=+1）
      - - "FSSSF"
        - "S___S"
        - "S___S"
        - "S___S"
        - "FSSSF"
      # 第 5 层（y=+2）：外圈框架 + 内 3×3 稳定器
      - - "FFFFF"
        - "FTTTF"
        - "FTTTF"
        - "FTTTF"
        - "FFFFF"
    legend:
      # 字符 -> part id / Material 名 / nu（必须空气）/ #标签（按标签判定）
      #
      # ★ 保护罩与 IO 接口共用一个标签 touhou:reactor_shell
      #   （在代码里用 ItemTags 登记），所以写法是 "#touhou:reactor_shell" ——
      #   意思是"这一格放保护罩 / 输入接口 / 输出接口都算对"。
      # ★ 注意值里的 # 在 YAML 里是注释起始符，所以必须加引号。
      F: TOUHOU_COMPLEX_MACHINE_REACTOR_FRAME
      S: "#touhou:reactor_shell"
      T: TOUHOU_COMPLEX_MACHINE_REACTOR_STABILIZER
      B: TOUHOU_COMPLEX_MACHINE_REACTOR_BASE
      "_": nu
    # "每一类最多出现一个"的构件（列表；留空 = 不限制）。
    #   输入接口与输出接口可以【同时】各放一个（一个管进、一个管出），
    #   但同一类多了就说不清 Cargo 该认哪个口 —— 所以按 id 逐个限制为最多 1 个。
    unique-parts:
      - TOUHOU_COMPLEX_MACHINE_REACTOR_INPUT_PORT
      - TOUHOU_COMPLEX_MACHINE_REACTOR_OUTPUT_PORT

  # --------------------------------------------------------------------------
  # 附加粒子特效（核心周围的火焰粒子；每台机器还能在 GUI 的 P 槽单独开关）
  #   · 空闲中 / 进程运行中：每 interval-ticks 个 tick，在半径 inner-radius ~
  #     outer-radius 的【球壳】内随机生成 amount 颗火焰粒子
  #     （4 tick = 0.2 秒；想要 2 秒一次就写 40）
  #   · 每次进程结束：立刻在同一个球壳内随机爆 completion-burst 颗
  #   · 未激活：完全不生成
  #   · inner-radius 写 0 就退化成实心球；必须 < outer-radius
  # --------------------------------------------------------------------------
  particles:
    enabled: true
    inner-radius: 3.0
    outer-radius: 5.0
    amount: 20
    interval-ticks: 4
    completion-burst: 40

# ============================================================================
# 赛钱箱（TOUHOU_COMPLEX_MACHINE_SAIZENBAKO）—— 多方块核心
#   结构：9(x) × 6(y) × 9(z)，6 根木桩 + 1 个赛钱箱核心，其余是红羊毛/灯笼/橡木原木。
#   ★★ 与反应堆那份层图唯一的写法差别：核心 'C' 不落在层图正中
#      （它在第 1 层第 5 行第 9 列 = x 最右一列、z 居中）。
#      坐标换算一律以核心那一格为原点，所以偏心核心照样能算对；
#      反应堆那边仍然要求核心居中（防手滑写偏），行为一字未改。
#   ★ 层图写法、legend 语义、'C' 的保留含义都与 reactor.structure 完全一致，
#     解析走同一个 LayerParser。
#   ★★ 空气格在这里画的是 '.'（与扫描报告 docs\saizenbako-layers.yml 逐字一致，
#      方便对照 diff），但 legend 里必须是 "_"：Bukkit 的 YAML 把 '.' 当路径分隔符，
#      键写成 "." 时 getKeys(false) 读不到它。代码会在读取时把 '.' 归一化成 '_'
#      （见 AddonConfig.normalizeAirChar），所以两边都能用、也不会漏检空气格。
#   ★ 这一段整段删掉也能跑：内置默认值就是 docs\saizenbako-layers.yml 那份权威层图。
# ============================================================================
saizenbako:
  # 一次运作消耗的 POWER（spec：消耗 2 点）。
  # ⚠ 赛钱箱容量默认只有 5 POWER，所以这个数直接决定"一次能连做几次"。
  power-cost: 2
  # 祭坛【自己】的消息前缀。
  #   ★ 必须与上面 reactor 段的 message-prefix 分开：两者共用过一次，
  #     结果祭坛的提示顶着「[灵乌路空反应堆]」出现在聊天栏。
  message-prefix: "&8[&d祭坛&8] &r"
  messages:
    # 祭坛自己的消息档位：off / important / normal / all。
    #   ★ 默认 off（只报 warning/error）—— 比反应堆的 important 更安静：
    #     "已激活 / 结构明细"在 GUI 信息格里本来就看得见，不必再刷聊天栏。
    #   想让祭坛也推常规反馈就改成 normal。
    level: off
  machine:
    # 机器逻辑的运作间隔（Slimefun tick，10 tick ≈ 1 秒）：
    #   每轮做「读 6 根木桩的 IO 槽 → 镜像进 6 个预留槽 → 比对配方 → 产出」。
    work-interval-ticks: 10
    # 已激活时每多少轮做一次【现场结构复检】（只用来"发现结构被拆 → 停机清编号"）。
    #   ★ 复检永远不会自动激活机器 —— 激活只能由玩家在 GUI 里点出来。
    recheck-passes: 5
  structure:
    layers:
      # 第 1 层（相对核心 y=0）：核心 C 在最右一列
      - - "..O.L.O.."
        - "........."
        - "R.......O"
        - "........."
        - "........C"
        - "........."
        - "R.......O"
        - "........."
        - "..O.L.O.."
      # 第 2 层（y=+1）
      - - "..O...O.."
        - "........."
        - "R.......O"
        - "........."
        - "........."
        - "........."
        - "R.......O"
        - "........."
        - "..O...O.."
      # 第 3 层（y=+2）：6 根木桩全在这一层
      - - "..P...P.."
        - "L........"
        - "R.......P"
        - "........."
        - "........."
        - "........."
        - "R.......P"
        - "L........"
        - "..P...P.."
      # 第 4 层（y=+3）
      - - "R........"
        - "R........"
        - "R........"
        - "R........"
        - "R........"
        - "R........"
        - "R........"
        - "R........"
        - "R........"
      # 第 5 层（y=+4）
      - - "........."
        - "........."
        - "R........"
        - "........."
        - "........."
        - "........."
        - "R........"
        - "........."
        - "........."
      # 第 6 层（y=+5）
      - - "R........"
        - "R........"
        - "R........"
        - "R........"
        - "R........"
        - "R........"
        - "R........"
        - "R........"
        - "R........"
    legend:
      # 字符 -> part id / Material 名 / nu（必须空气）；'C' 是保留字符，不登记
      R: RED_WOOL
      L: LANTERN
      O: OAK_LOG
      P: TOUHOU_COMPLEX_MACHINE_SHRINE_POST
      "_": nu

# ============================================================================
# 梦想封印 集（TOUHOU_PARTY_ITEM_FANTASY_SEAL_CONVERGE）
#   灵梦的符卡「夢想封印」的「集」形态 —— 360° 追踪弹幕发射器。
#   ★ 能源：自研 POWER（不再是 Slimefun 电力 J）。
#     手持时每 2 秒从【玩家附近最近的 POWER 网络】取 1 点 POWER；
#     附近没有网络 / 网络里没电 ⇒ 不充能，并给一条节流过的 warning
#     （玩家可见反馈一律走 Notify.warn —— info/important 档位在默认配置下是静默的）。
#   ★★ 四个数字（上限 40 / 单发 1 / 充能 1 每 2 秒 / 冷却 1.5 秒）**不在本文件**，
#      它们是 ItemSetting，落在 plugins/Slimefun/Items.yml 的
#      TOUHOU_PARTY_ITEM_FANTASY_SEAL_CONVERGE 一节里（连同发射参数一起）：
#        power-capacity: 40        道具自身的 POWER 缓冲上限
#        power-cost: 1             单次发射消耗
#        charge-per-cycle: 1       每个充能节拍充入多少
#        charge-interval-seconds: 2 充能节拍间隔（秒）
#        cooldown-millis: 1500     每发之后的冷却
#        charge-range: 4           取电的搜索半径（格）
#        hint-throttle-seconds: 15 "充能失败"提示的最小间隔（秒）
#     数值只保留那一处出处，这里不复制（复制出来的那份一定会漂移）。
# ============================================================================
seal:
  # 道具【自己】的消息前缀。
  #   ★ 同样不许蹭反应堆的：原先它走默认作用域，提示顶着
  #     「[灵乌路空反应堆]」出现在聊天栏（与祭坛踩过的是同一个坑）。
  message-prefix: "&8[&d梦想封印 集&8] &r"
  messages:
    # 道具自己的消息档位：off / important / normal / all。
    #   ★ 默认 off：本道具目前只发 warning，而 warning 不受档位影响、永远输出。
    #     这一格是给"以后想推常规操作反馈"留的开关。
    level: off

# ============================================================================
# 幻梦捕捉器（TOUHOU_POWER_DREAMCATCHER）—— POWER 体系的第一台产能设备
#   原创机器（不是东方原作要素）：名字取「捕梦网 dreamcatcher」的意象，
#   把梦收进标靶里榨成 POWER。
#
#   规则：只看机器【四个水平面】（东/南/西/北，不含上下）是否紧贴床（Tag.BEDS）。
#         效率 = 有床的面数 × 100%（0~4）：
#           1 张床 → 8 秒 1 POWER      2 张床 → 4 秒 1 POWER
#           3 张床 → 8/3 秒 1 POWER    4 张床 → 2 秒 1 POWER
#           0 张床 → 不产出（并且计时归零，重新放床要重新等满一整段）
#
#   "优先对外输出"：它是 POWER 网络的 GENERATOR 节点（只捐不取）——
#   产出先投递给网络里别的节点，投不出去才留在自己 15 点的缓冲里；
#   即便投递失败，下一次网络结算也会把发电机缓冲里的电捐给储能点。
#
#   ★★ 数值同样不在本文件，而是 ItemSetting，落在 plugins/Slimefun/Items.yml 的
#      TOUHOU_POWER_DREAMCATCHER 一节里：
#        capacity: 15                   自身缓冲上限
#        base-interval-seconds: 8       基准间隔（1 张床时的产出周期）
#        power-per-cycle: 1             每轮产出多少 POWER
#        bed-scan-interval-millis: 1000 多久重数一次四周的床（节流）
#   ★ 本机没有 GUI：状态看 /touhou power <x> <y> <z> 与 /touhou dreamcatcher <x> <y> <z>。
# ============================================================================

